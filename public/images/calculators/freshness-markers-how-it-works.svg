<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Freshness markers calculation flow: days since update and half-life feed into exponential decay formula to produce a freshness score">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── Row labels ── -->
  <text x="8" y="72" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">INPUTS</text>
  <text x="8" y="158" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">INPUTS</text>

  <!-- ══ TOP ROW ══ -->
  <!-- Days Since Update -->
  <rect x="56" y="44" width="130" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="121" y="66" text-anchor="middle" font-size="11.5" fill="#1e40af" font-weight="600">Days Since</text>
  <text x="121" y="83" text-anchor="middle" font-size="11.5" fill="#1e40af" font-weight="600">Last Update</text>
  <text x="121" y="100" text-anchor="middle" font-size="10.5" fill="#3b82f6">e.g. 30</text>

  <!-- Arrow top → formula -->
  <line x1="186" y1="70" x2="294" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ BOTTOM ROW ══ -->
  <!-- Half-Life -->
  <rect x="56" y="124" width="130" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="121" y="146" text-anchor="middle" font-size="11.5" fill="#1e40af" font-weight="600">Half-Life</text>
  <text x="121" y="163" text-anchor="middle" font-size="11.5" fill="#1e40af" font-weight="600">(days)</text>
  <text x="121" y="180" text-anchor="middle" font-size="10.5" fill="#3b82f6">e.g. 180</text>

  <!-- Arrow bottom → formula -->
  <line x1="186" y1="150" x2="294" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ FORMULA BOX ══ -->
  <rect x="294" y="74" width="178" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="383" y="96" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Exponential Decay</text>
  <text x="383" y="113" text-anchor="middle" font-size="10.5" fill="#64748b">Score = 100 × 2^(−d/h)</text>
  <text x="383" y="130" text-anchor="middle" font-size="10" fill="#64748b">d = days · h = half-life</text>

  <!-- Arrow formula → result -->
  <line x1="472" y1="110" x2="524" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ RESULT BOX ══ -->
  <rect x="524" y="80" width="168" height="60" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="608" y="103" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.85)" font-weight="500">Freshness Score</text>
  <text x="608" y="128" text-anchor="middle" font-size="18" fill="white" font-weight="700">0 – 100</text>
</svg>
