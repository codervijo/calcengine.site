<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Encryption coverage calculation flow diagram">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── Row labels ── -->
  <text x="4" y="82" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">AT REST</text>
  <text x="4" y="158" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">IN TRANSIT</text>

  <!-- ══ AT REST ROW ══ -->
  <!-- Encrypted at Rest -->
  <rect x="60" y="48" width="130" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="70" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">Encrypted at Rest</text>
  <text x="125" y="88" text-anchor="middle" font-size="11" fill="#3b82f6">e.g. 40 assets</text>

  <!-- Arrow: at rest → coverage -->
  <line x1="190" y1="74" x2="264" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="227" y="65" text-anchor="middle" font-size="9.5" fill="#64748b">÷ Total Assets</text>
  <text x="227" y="87" text-anchor="middle" font-size="9.5" fill="#64748b">× 100</text>

  <!-- At-Rest Coverage -->
  <rect x="264" y="48" width="124" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="326" y="70" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">At-Rest %</text>
  <text x="326" y="88" text-anchor="middle" font-size="11" fill="#3b82f6">80.0%</text>

  <!-- ══ IN TRANSIT ROW ══ -->
  <!-- Encrypted in Transit -->
  <rect x="60" y="124" width="130" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="146" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">Encrypted in Transit</text>
  <text x="125" y="164" text-anchor="middle" font-size="11" fill="#3b82f6">e.g. 45 assets</text>

  <!-- Arrow: in transit → coverage -->
  <line x1="190" y1="150" x2="264" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="227" y="141" text-anchor="middle" font-size="9.5" fill="#64748b">÷ Total Assets</text>
  <text x="227" y="163" text-anchor="middle" font-size="9.5" fill="#64748b">× 100</text>

  <!-- In-Transit Coverage -->
  <rect x="264" y="124" width="124" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="326" y="146" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">In-Transit %</text>
  <text x="326" y="164" text-anchor="middle" font-size="11" fill="#3b82f6">90.0%</text>

  <!-- ══ CONVERGENCE LINES ══ -->
  <line x1="388" y1="74" x2="446" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="388" y1="150" x2="446" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="446" y1="112" x2="482" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ÷2 label at merge -->
  <circle cx="446" cy="112" r="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="446" y="117" text-anchor="middle" font-size="11" fill="#64748b" font-weight="500">÷2</text>

  <!-- ══ OVERALL COVERAGE ══ -->
  <rect x="482" y="86" width="168" height="52" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="566" y="107" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)" font-weight="500">Overall Coverage</text>
  <text x="566" y="127" text-anchor="middle" font-size="16" fill="white" font-weight="700">85.0%</text>
</svg>
