<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="Inter, system-ui, sans-serif" role="img" aria-label="EU device compliance quiz scoring flow diagram: six yes/no questions feed into a scoring engine to produce a compliance readiness score">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── Column labels ── -->
  <text x="12" y="28" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">QUESTIONS</text>
  <text x="330" y="28" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">SCORING</text>
  <text x="534" y="28" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">RESULT</text>

  <!-- ══ QUESTION BOXES (left column) ══ -->
  <!-- Q1: CE Marking -->
  <rect x="12" y="38" width="148" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="55" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">CE Marking</text>
  <text x="86" y="70" text-anchor="middle" font-size="10" fill="#3b82f6">Yes / No</text>

  <!-- Q2: Vuln Policy -->
  <rect x="12" y="90" width="148" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="107" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Vulnerability Policy</text>
  <text x="86" y="122" text-anchor="middle" font-size="10" fill="#3b82f6">Yes / No</text>

  <!-- Q3: SBOM -->
  <rect x="12" y="142" width="148" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="159" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">SBOM + Encryption</text>
  <text x="86" y="174" text-anchor="middle" font-size="10" fill="#3b82f6">Yes / No</text>

  <!-- ══ LINES from questions to sum node ══ -->
  <line x1="160" y1="58" x2="296" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="110" x2="296" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="162" x2="296" y2="110" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ══ SUM NODE ══ -->
  <circle cx="310" cy="110" r="14" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="115" text-anchor="middle" font-size="13" fill="#64748b" font-weight="600">Σ</text>

  <!-- Arrow: sum → formula box -->
  <line x1="324" y1="110" x2="362" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ SCORING FORMULA BOX ══ -->
  <rect x="362" y="84" width="158" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="441" y="105" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Score Formula</text>
  <text x="441" y="123" text-anchor="middle" font-size="10" fill="#3b82f6">(Passed ÷ 6) × 100</text>

  <!-- Arrow: formula → result -->
  <line x1="520" y1="110" x2="536" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ RESULT BOX (blue) ══ -->
  <rect x="536" y="84" width="132" height="52" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="602" y="105" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)" font-weight="500">Compliance Score</text>
  <text x="602" y="126" text-anchor="middle" font-size="18" fill="white" font-weight="700">83%</text>

  <!-- ══ TIER LABELS (bottom) ══ -->
  <text x="536" y="155" font-size="9" fill="#94a3b8">≥84% High · 50–83% Partial · &lt;50% Low</text>
</svg>
