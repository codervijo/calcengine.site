<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Device lifecycle compliance calculation flow: total devices, EOL devices, and near-EOL devices combine to produce compliance rate">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── Row labels ── -->
  <text x="8" y="56" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">TOTAL</text>
  <text x="8" y="128" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">EOL</text>
  <text x="8" y="200" font-size="10" fill="#94a3b8" font-weight="500" letter-spacing="0.5">NEAR-EOL</text>

  <!-- ══ INPUT BOXES ══ -->

  <!-- Total Devices -->
  <rect x="62" y="22" width="138" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="131" y="44" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">Total Devices</text>
  <text x="131" y="62" text-anchor="middle" font-size="11" fill="#3b82f6">e.g. 5,000</text>

  <!-- EOL Devices -->
  <rect x="62" y="96" width="138" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="131" y="118" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">EOL Devices</text>
  <text x="131" y="136" text-anchor="middle" font-size="11" fill="#3b82f6">e.g. 750</text>

  <!-- Near-EOL Devices -->
  <rect x="62" y="170" width="138" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="131" y="192" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">Near-EOL Devices</text>
  <text x="131" y="210" text-anchor="middle" font-size="11" fill="#3b82f6">e.g. 300</text>

  <!-- ══ LINES TO MERGE CIRCLE ══ -->
  <!-- Total → merge -->
  <line x1="200" y1="48" x2="340" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- EOL → merge (straight) -->
  <line x1="200" y1="122" x2="318" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Near-EOL → merge -->
  <line x1="200" y1="196" x2="340" y2="122" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Formula label on top line -->
  <text x="262" y="76" text-anchor="middle" font-size="9.5" fill="#64748b">Total − EOL</text>
  <text x="262" y="89" text-anchor="middle" font-size="9.5" fill="#64748b">÷ Total</text>

  <!-- At-risk label on bottom line -->
  <text x="262" y="178" text-anchor="middle" font-size="9.5" fill="#64748b">+ Near-EOL</text>
  <text x="262" y="191" text-anchor="middle" font-size="9.5" fill="#64748b">= at-risk</text>

  <!-- Merge circle -->
  <circle cx="340" cy="122" r="18" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="127" text-anchor="middle" font-size="13" fill="#64748b" font-weight="500">%</text>

  <!-- Arrow: merge → result -->
  <line x1="358" y1="122" x2="400" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ RESULT BOX ══ -->
  <rect x="400" y="92" width="256" height="60" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="528" y="116" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)" font-weight="500">Lifecycle Compliance Rate</text>
  <text x="528" y="140" text-anchor="middle" font-size="20" fill="white" font-weight="700">85.0% in-support</text>
</svg>
