<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Firmware risk score calculation flow: four input signals combine into a total risk score">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── Row labels ── -->
  <text x="8" y="52" font-size="9" fill="#94a3b8" font-weight="500" letter-spacing="0.5">CVEs</text>
  <text x="8" y="102" font-size="9" fill="#94a3b8" font-weight="500" letter-spacing="0.5">PATCH</text>
  <text x="8" y="152" font-size="9" fill="#94a3b8" font-weight="500" letter-spacing="0.5">SBOM</text>
  <text x="8" y="202" font-size="9" fill="#94a3b8" font-weight="500" letter-spacing="0.5">EXPOSURE</text>

  <!-- ══ ROW 1 — Critical CVEs ══ -->
  <rect x="60" y="24" width="130" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="44" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Critical CVEs</text>
  <text x="125" y="62" text-anchor="middle" font-size="10" fill="#3b82f6">e.g. 3</text>

  <line x1="190" y1="48" x2="270" y2="48" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="41" text-anchor="middle" font-size="9" fill="#64748b">× 5, cap 40</text>

  <rect x="270" y="24" width="110" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="44" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">CVE Score</text>
  <text x="325" y="62" text-anchor="middle" font-size="10" fill="#3b82f6">0–40 pts</text>

  <!-- ══ ROW 2 — Patch Lag ══ -->
  <rect x="60" y="74" width="130" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="94" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Days Since Patch</text>
  <text x="125" y="112" text-anchor="middle" font-size="10" fill="#3b82f6">e.g. 180</text>

  <line x1="190" y1="98" x2="270" y2="98" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="91" text-anchor="middle" font-size="9" fill="#64748b">÷365 × 30</text>
  <text x="230" y="111" text-anchor="middle" font-size="9" fill="#64748b">cap 30</text>

  <rect x="270" y="74" width="110" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="94" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Patch Score</text>
  <text x="325" y="112" text-anchor="middle" font-size="10" fill="#3b82f6">0–30 pts</text>

  <!-- ══ ROW 3 — SBOM Coverage ══ -->
  <rect x="60" y="124" width="130" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="144" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">SBOM Coverage</text>
  <text x="125" y="162" text-anchor="middle" font-size="10" fill="#3b82f6">e.g. 60%</text>

  <line x1="190" y1="148" x2="270" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="141" text-anchor="middle" font-size="9" fill="#64748b">(100−%) / 100</text>
  <text x="230" y="161" text-anchor="middle" font-size="9" fill="#64748b">× 20</text>

  <rect x="270" y="124" width="110" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="144" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">SBOM Score</text>
  <text x="325" y="162" text-anchor="middle" font-size="10" fill="#3b82f6">0–20 pts</text>

  <!-- ══ ROW 4 — Exposure ══ -->
  <rect x="60" y="174" width="130" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="194" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Internet-Facing %</text>
  <text x="125" y="212" text-anchor="middle" font-size="10" fill="#3b82f6">e.g. 40%</text>

  <line x1="190" y1="198" x2="270" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="191" text-anchor="middle" font-size="9" fill="#64748b">% / 100 × 10</text>

  <rect x="270" y="174" width="110" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="194" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">Exposure Score</text>
  <text x="325" y="212" text-anchor="middle" font-size="10" fill="#3b82f6">0–10 pts</text>

  <!-- ══ CONVERGENCE LINES to + node ══ -->
  <line x1="380" y1="48"  x2="458" y2="123" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="98"  x2="458" y2="123" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="148" x2="458" y2="123" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="198" x2="458" y2="123" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="470" y1="123" x2="510" y2="123" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- + merge node -->
  <circle cx="458" cy="123" r="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="458" y="128" text-anchor="middle" font-size="14" fill="#64748b" font-weight="500">+</text>

  <!-- ══ RESULT ══ -->
  <rect x="510" y="97" width="180" height="52" rx="8" fill="#1565c0" filter="url(#shadow)"/>
  <text x="600" y="118" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)" font-weight="500">Risk Score / Level</text>
  <text x="600" y="138" text-anchor="middle" font-size="16" fill="white" font-weight="700">0–100 · Low→Critical</text>
</svg>
